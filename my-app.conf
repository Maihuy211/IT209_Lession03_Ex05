server {
    listen 80 default_server;
    server_name _;

    root /opt/my-app/html;
    index index.html;

    # Logs co lap ra /opt theo yeu cau Bai 5
    access_log /opt/my-app/logs/access.log combined;
    error_log  /opt/my-app/logs/error.log warn;

    location / {
        try_files $uri $uri/ =404;
    }
}
